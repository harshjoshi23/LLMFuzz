# Host-fuzzing configuration notes:
# We are building the BMS logic on native_sim.

# Enable BMS IC Kconfig menu so that CONFIG_BMS_IC_MAX_* symbols exist.
CONFIG_BMS_IC=y

# Required for BMS emulation
CONFIG_EMUL=y
CONFIG_GPIO=y
CONFIG_I2C=y

# Make config symbols concrete for compilation (sizes + optional features)
CONFIG_BMS_IC_MAX_CELLS=16
CONFIG_BMS_IC_MAX_THERMISTORS=2
CONFIG_BMS_IC_CURRENT_MONITORING=y
CONFIG_BMS_IC_SWITCHES=y

CONFIG_ZTEST=y

# enable click-able absolute paths in assert messages
CONFIG_BUILD_OUTPUT_STRIP_PATHS=n
